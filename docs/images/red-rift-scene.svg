<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Red Rift animated scene">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#2b1210"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff241c" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff241c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff241c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff241c"/>
    </linearGradient>
  </defs>
  <style>
    .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
    .glow { animation: pulse 4s ease-in-out infinite alternate; transform-origin: 450px 105px; }
    @keyframes pulse { from { opacity: 0.7; transform: scale(1); } to { opacity: 1; transform: scale(1.12); } }
    .lavaglow { animation: lavapulse 3s ease-in-out infinite alternate; }
    @keyframes lavapulse { from { opacity: 0.75; } to { opacity: 1; } }
    .ember { animation: rise linear infinite; }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(-210px); opacity: 0; }
    }
    .fog { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-25px); } to { transform: translateX(25px); } }
  </style>
  <rect width="900" height="300" fill="url(#sky)"/>
  <g fill="#e6edf3">
    <circle class="star" cx="60" cy="40" r="1.6" style="animation-delay: 0s"/>
    <circle class="star" cx="150" cy="80" r="1.2" style="animation-delay: 0.8s"/>
    <circle class="star" cx="240" cy="35" r="1.8" style="animation-delay: 1.6s"/>
    <circle class="star" cx="320" cy="90" r="1.1" style="animation-delay: 0.4s"/>
    <circle class="star" cx="560" cy="45" r="1.6" style="animation-delay: 1.2s"/>
    <circle class="star" cx="640" cy="85" r="1.2" style="animation-delay: 2s"/>
    <circle class="star" cx="720" cy="38" r="1.8" style="animation-delay: 0.6s"/>
    <circle class="star" cx="810" cy="75" r="1.3" style="animation-delay: 1.4s"/>
    <circle class="star" cx="860" cy="30" r="1.5" style="animation-delay: 2.4s"/>
    <circle class="star" cx="40" cy="130" r="1.2" style="animation-delay: 1s"/>
    <circle class="star" cx="870" cy="140" r="1.2" style="animation-delay: 1.8s"/>
  </g>
  <circle class="glow" cx="450" cy="105" r="78" fill="url(#moonglow)"/>
  <circle cx="450" cy="105" r="52" fill="#ff241c"/>
  <circle cx="432" cy="88" r="10" fill="#ff5a4e" opacity="0.7"/>
  <polygon points="0,230 120,170 260,215 380,160 520,210 640,165 780,215 900,180 900,300 0,300" fill="#1a2233"/>
  <polygon points="0,260 150,210 300,255 450,200 600,258 750,208 900,252 900,300 0,300" fill="#0f141d"/>
  <ellipse class="fog" cx="450" cy="245" rx="220" ry="18" fill="#e6edf3" opacity="0.10"/>
  <path class="lavaglow" d="M0,285 Q150,270 300,282 T600,278 T900,284 L900,300 L0,300 Z" fill="url(#lava)"/>
  <g>
    <circle class="ember" cx="180" cy="278" r="3" fill="#ff6b35" style="animation-duration: 5s; animation-delay: 0s"/>
    <circle class="ember" cx="260" cy="282" r="2.2" fill="#ff241c" style="animation-duration: 6.5s; animation-delay: 1.2s"/>
    <circle class="ember" cx="340" cy="276" r="3.4" fill="#ffb347" style="animation-duration: 4.5s; animation-delay: 2s"/>
    <circle class="ember" cx="430" cy="280" r="2.4" fill="#ff6b35" style="animation-duration: 7s; animation-delay: 0.6s"/>
    <circle class="ember" cx="510" cy="278" r="3" fill="#ff241c" style="animation-duration: 5.5s; animation-delay: 3s"/>
    <circle class="ember" cx="590" cy="282" r="2.2" fill="#ffb347" style="animation-duration: 6s; animation-delay: 1.8s"/>
    <circle class="ember" cx="670" cy="276" r="3.2" fill="#ff6b35" style="animation-duration: 4.8s; animation-delay: 2.6s"/>
    <circle class="ember" cx="740" cy="280" r="2.4" fill="#ff241c" style="animation-duration: 7.5s; animation-delay: 0.3s"/>
    <circle class="ember" cx="220" cy="284" r="2" fill="#ffb347" style="animation-duration: 6.2s; animation-delay: 3.6s"/>
    <circle class="ember" cx="620" cy="284" r="2" fill="#ff6b35" style="animation-duration: 5.2s; animation-delay: 4.2s"/>
  </g>
</svg>
